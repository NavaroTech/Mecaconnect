<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription &amp; Vérification KYC — MecaConnect Guinée</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --accent: #eab308;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --danger: #b91c1c;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }

    .brand h1 {
      font-size: 1.35rem;
      color: var(--primary);
    }

    .brand p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .api-badge {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: #e2e8f0;
      color: var(--text);
      font-weight: 600;
    }

    .api-badge.ok {
      background: #dcfce7;
      color: var(--success);
    }

    .api-badge.err {
      background: #fee2e2;
      color: var(--danger);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--text);
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #334155;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #1e293b;
    }

    .status-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status-box.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: var(--danger);
    }

    .status-box.success {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: var(--success);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <h1>MecaConnect Guinée</h1>
        <p>Inscription, Vérification KYC &amp; Services Mécaniques (GNF / +224)</p>
      </div>
      <div id="apiStatusBadge" class="api-badge">Vérification API...</div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>Inscription &amp; Vérification KYC</h2>
        <form id="kycForm">
          <div class="field">
            <label for="fullName">Nom complet</label>
            <input id="fullName" name="full_name" type="text" placeholder="Ex. Mamadou Bah" required />
          </div>

          <div class="field">
            <label for="phone">Téléphone Guinée (+224)</label>
            <input id="phone" name="phone" type="tel" value="+224 " placeholder="+224 620 00 00 00" required />
            <div class="hint">Format guinéen : +224 suivi de 8 ou 9 chiffres.</div>
          </div>

          <div class="field">
            <label for="role">Profil</label>
            <select id="role" name="role">
              <option value="client">Client / Conducteur</option>
              <option value="mechanic">Mécanicien / Garage</option>
            </select>
          </div>

          <div class="field">
            <label for="idNumber">Numéro de pièce d'identité (unique par compte)</label>
            <input id="idNumber" name="id_number" type="text" placeholder="CNI / Passeport / Permis" required />
          </div>

          <div class="field">
            <label for="selfieFile">Photo selfie de vérification KYC</label>
            <input id="selfieFile" name="selfie" type="file" accept="image/*" required />
          </div>

          <button type="submit" class="btn">Valider l'inscription &amp; le KYC</button>
        </form>
        <div id="kycResult" class="status-box">En attente de soumission.</div>
      </section>

      <section class="card">
        <h2>Connexion &amp; Estimation / Demande (GNF)</h2>
        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">Email ou téléphone</label>
            <input id="loginEmail" name="identifier" type="text" placeholder="admin@mecaconnect.gn ou +224..." required />
          </div>
          <div class="field">
            <label for="loginPassword">Mot de passe</label>
            <input id="loginPassword" name="password" type="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn">Se connecter</button>
          <button type="button" id="pingApiBtn" class="btn btn-secondary">Tester la connexion API &amp; Base</button>
        </form>

        <div class="field" style="margin-top: 18px;">
          <label for="amountGnf">Montant estimé / prestation (GNF)</label>
          <input id="amountGnf" type="number" step="1000" min="1000" value="150000" />
          <div id="formattedGnf" class="hint">Montant formaté : 150 000 GNF</div>
        </div>

        <div id="sessionResult" class="status-box">Prêt.</div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
